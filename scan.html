<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ماسح جوكر | تطبيقات جوكر</title>
<link rel="stylesheet" href="fonts-scan.css"><link rel="stylesheet" href="joker-base-v2.css?v=quality1">
<style>
:root{
  --bg:#0A1B1A; --surface:#102826; --surface2:#173836;
  --accent:#2DD4BF; --accent2:#F97316;
  --font-head:'Changa',sans-serif; --font-body:'Changa',sans-serif;
}
body{background:radial-gradient(700px 320px at 85% 0%, rgba(45,212,191,.14), transparent 60%), var(--bg)}
#camWrap{position:relative;border-radius:16px;overflow:hidden;background:#000;display:none}
#cam{width:100%;display:block;max-height:280px;object-fit:cover}
#scanline{position:absolute;inset-inline:12%;top:50%;height:3px;background:var(--accent2);box-shadow:0 0 12px var(--accent2);animation:mv 1.6s ease-in-out infinite alternate}
@keyframes mv{from{transform:translateY(-60px)}to{transform:translateY(60px)}}
.stars{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:.15rem;font-size:1.4rem}
.stars button{background:none;color:var(--surface2)}
.stars button.on{color:#FBBF24}
.prod-img{width:74px;height:74px;object-fit:contain;border-radius:12px;background:#fff;flex:none}
.privacy{font-size:.78rem;color:var(--muted);background:var(--surface2);border-radius:12px;padding:.55rem .8rem}

</style>

<link rel="icon" href="crown.svg" type="image/svg+xml">
<meta name="theme-color" content="#0A1B1A">
</head>
<body>
<div class="jk-wrap">
  <header class="jk-header" id="jk-header"></header>

  <section class="jk-card">
    <h2 style="font-size:1.05rem">امسح منتج</h2>
    <div id="camWrap"><video id="cam" playsinline muted></video><div id="scanline"></div></div>
    <div class="jk-row" style="margin-top:.7rem">
      <button class="jk-btn" id="startCam" style="flex:1">📷 تشغيل الكاميرا</button>
      <button class="jk-btn ghost" id="stopCam" style="display:none">إيقاف</button>
    </div>
    <div id="camNote" class="muted" style="margin-top:.4rem"></div>
    <label style="margin-top:.8rem">أو اكتب الباركود يدوي</label>
    <div class="jk-row">
      <input id="manual" inputmode="numeric" placeholder="مثال: 6224001234567">
      <button class="jk-btn" id="lookup" style="flex:none">بحث</button>
    </div>
    <div class="privacy" style="margin-top:.8rem">خصوصيتك: رقم الباركود بس هو اللي بيتبعت لقاعدة بيانات Open Food Facts المجانية عشان يجيب بيانات المنتج. صورك وتقييماتك وملاحظاتك بتفضل على جهازك. مش كل المنتجات موجودة في القاعدة، خصوصًا المنتجات المحلية، وساعتها تقدر تسجّل المنتج بنفسك.</div>
  </section>

  <section class="jk-card" id="result" style="display:none"></section>

  <section class="jk-card">
    <div class="jk-row between">
      <h2 style="font-size:1.05rem">منتجاتك المحفوظة <span class="muted" id="count"></span></h2>
      <input id="q" placeholder="ابحث…" style="width:120px;padding:.45rem .7rem">
    </div>
    <div id="list"></div>
  </section>

  <footer class="jk-footer" id="jk-footer"></footer>
</div>
<script src="joker-core.js?v=quality1"></script>
<script>
JK.chrome({title:'ماسح جوكر', tagline:'امسح الباركود واعرف منتجك واحفظه'});
const S = JK.store('scan:products');
let stream = null, detector = null, scanning = false, cameraGeneration = 0;
let lookupGeneration = 0, lookupController = null;
const camNote = document.getElementById('camNote');
const startButton = document.getElementById('startCam');
if (!('BarcodeDetector' in window)) camNote.textContent = 'المتصفح ده مش بيدعم المسح التلقائي للباركود. استخدم الكتابة اليدوية تحت.';

function safeImageUrl(raw){
  try { const url = new URL(String(raw)); return url.protocol === 'https:' ? url.href : ''; }
  catch(e){ return ''; }
}
startButton.addEventListener('click', async () => {
  if (startButton.disabled) return;
  if (!('BarcodeDetector' in window)){ JK.toast('المسح غير مدعوم في المتصفح ده. تقدر تكتب الباركود.'); return; }
  const token = ++cameraGeneration; startButton.disabled = true;
  try {
    const wanted = ['ean_13','ean_8','upc_a','upc_e','code_128','qr_code'];
    const supported = BarcodeDetector.getSupportedFormats ? await BarcodeDetector.getSupportedFormats() : wanted;
    const formats = wanted.filter(x => supported.includes(x));
    if (!formats.length) throw new Error('المتصفح مش بيدعم صيغ الباركود المطلوبة. استخدم الكتابة اليدوية.');
    if (token !== cameraGeneration || document.hidden) return;
    detector = new BarcodeDetector({formats});
    const opened = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
    if (token !== cameraGeneration || document.hidden){ opened.getTracks().forEach(t => t.stop()); return; }
    stream = opened;
    const video = document.getElementById('cam'); video.srcObject = stream;
    await video.play();
    if (token !== cameraGeneration || document.hidden){ stopCam(); return; }
    document.getElementById('camWrap').style.display = 'block';
    document.getElementById('stopCam').style.display = '';
    camNote.textContent = 'وجّه الكاميرا للباركود. الكاميرا بتقف لو خرجت من الصفحة.';
    scanning = true; tick();
  } catch(err){
    if (token === cameraGeneration){ stopCam(); camNote.textContent = 'مقدرناش نفتح المسح: ' + (err.name === 'NotAllowedError' ? 'إذن الكاميرا مرفوض. تقدر تستخدم الكتابة اليدوية.' : err.message); }
  } finally { if (token === cameraGeneration && !scanning) startButton.disabled = false; }
});
document.getElementById('stopCam').addEventListener('click', stopCam);
function stopCam(){
  cameraGeneration++; scanning = false;
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  const video = document.getElementById('cam'); video.pause(); video.srcObject = null;
  document.getElementById('camWrap').style.display = 'none';
  document.getElementById('stopCam').style.display = 'none'; startButton.disabled = false;
}
window.addEventListener('pagehide', stopCam);
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCam(); });
async function tick(){
  if (!scanning) return;
  try {
    const codes = await detector.detect(document.getElementById('cam'));
    if (!scanning) return;
    if (codes.length){ const code = codes[0].rawValue; stopCam(); lookup(code); return; }
  } catch(e){}
  if (scanning) setTimeout(() => requestAnimationFrame(tick), 350);
}
function manualLookup(){ const code = document.getElementById('manual').value.trim(); if (code) lookup(code); else JK.toast('اكتب رقم الباركود الأول.'); }
document.getElementById('lookup').addEventListener('click', manualLookup);
document.getElementById('manual').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); manualLookup(); } });

async function lookup(rawCode){
  const code = String(rawCode).trim();
  if (!code || code.length > 128){ JK.toast('الباركود غير مناسب للبحث. اكتب رقم المنتج أو سجّله يدويًا.'); return; }
  stopCam();
  const token = ++lookupGeneration;
  if (lookupController) lookupController.abort();
  const controller = new AbortController(); lookupController = controller;
  const timer = setTimeout(() => controller.abort(), 12000);
  const box = document.getElementById('result'), button = document.getElementById('lookup');
  button.disabled = true; box.style.display = '';
  box.innerHTML = '<div class="muted" role="status">بندور على المنتج… <span class="en">' + JK.esc(code) + '</span></div>';
  let prod = null, status = 'error';
  try {
    const response = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?fields=product_name,brands,quantity,image_small_url,nutriscore_grade,categories', {signal: controller.signal});
    if (!response.ok) throw new Error('provider unavailable');
    const data = await response.json();
    if (data.status === 1 && data.product && data.product.product_name){ prod = data.product; status = 'found'; }
    else if (data.status === 0) status = 'not-found';
    else status = 'incomplete';
  } catch(e){ status = controller.signal.aborted ? 'timeout' : 'error'; }
  finally { clearTimeout(timer); if (token === lookupGeneration){ lookupController = null; button.disabled = false; } }
  if (token !== lookupGeneration) return;
  if (status === 'found'){
    const image = safeImageUrl(prod.image_small_url);
    box.innerHTML = '<div class="jk-row">' + (image ? '<img class="prod-img" src="' + JK.esc(image) + '" alt="صورة المنتج">' : '') +
      '<div style="flex:1;min-width:0"><b>' + JK.esc(prod.product_name) + '</b><br><span class="muted">' +
      [prod.brands, prod.quantity, prod.nutriscore_grade ? 'Nutri-Score: ' + String(prod.nutriscore_grade).toUpperCase() : '', prod.categories].filter(Boolean).map(JK.esc).join(' · ') +
      '</span></div></div>' + saveForm(code, prod.product_name, image);
  } else {
    const message = status === 'not-found' ? 'المنتج ده مش متسجل في قاعدة البيانات حاليًا. تقدر تسجّله بنفسك:' :
      status === 'timeout' ? 'البحث أخد وقت طويل فوقفناه. ده مش معناه إن المنتج مش متسجل. جرّب تاني أو سجّله بنفسك:' :
      status === 'incomplete' ? 'بيانات المنتج اللي رجعت مش كاملة. تقدر تكمل اسمه وتحفظه بنفسك:' :
      'مقدرناش نوصل لبيانات المنتج. لسه ما اتأكدناش إذا كان متسجل. جرّب تاني أو سجّله بنفسك:';
    box.innerHTML = '<div class="muted" role="status" style="margin-bottom:.6rem">' + message + '</div>' + saveForm(code, '', '');
  }
  wireSave(box);
}

function saveForm(code, name, img){
  return '<label>الاسم</label><input id="sv_name" value="' + JK.esc(name) + '" required>' +
    '<label>تقييمك</label><div class="stars" id="stars">' + [1,2,3,4,5].map(i => '<button type="button" data-star="' + i + '">★</button>').join('') + '</div>' +
    '<label>ملاحظاتك (اختياري)</label><input id="sv_notes" placeholder="رأيك في المنتج">' +
    '<input type="hidden" id="sv_img" value="' + JK.esc(img) + '">' +
    '<button class="jk-btn block" id="sv_btn" data-code="' + JK.esc(code) + '">حفظ المنتج</button>';
}

function wireSave(box){
  let rating = 0;
  box.querySelectorAll('#stars button').forEach(b => b.addEventListener('click', () => {
    rating = +b.dataset.star;
    box.querySelectorAll('#stars button').forEach(x => x.classList.toggle('on', +x.dataset.star <= rating));
  }));
  box.querySelector('#sv_btn').addEventListener('click', () => {
    const name = box.querySelector('#sv_name').value.trim();
    if (!name){ JK.toast('اكتب اسم المنتج'); return; }
    try { S.add({code: box.querySelector('#sv_btn').dataset.code, name, rating,
           notes: box.querySelector('#sv_notes').value.trim(), img: box.querySelector('#sv_img').value}); } catch(err){ return; }
    JK.toast('اتحفظ المنتج ✔'); box.style.display = 'none'; render();
  });
}

const starStr = r => r ? '★'.repeat(r) + '☆'.repeat(5 - r) : 'من غير تقييم';
let q = '';
document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim(); render(); });

function render(){
  const items = S.all().filter(p => !q || (p.name + ' ' + p.code + ' ' + (p.notes || '')).includes(q));
  document.getElementById('count').textContent = items.length ? '(' + items.length + ')' : '';
  const el = document.getElementById('list');
  if (!items.length){ el.innerHTML = JK.emptyState(q ? 'مفيش نتايج' : 'لسه مفيش منتجات محفوظة. امسح أول باركود.'); return; }
  el.innerHTML = items.map(p =>
    '<div class="jk-list-item">' +
      (safeImageUrl(p.img) ? '<img class="prod-img" src="' + JK.esc(safeImageUrl(p.img)) + '" alt="" style="width:48px;height:48px">' : '') +
      '<div style="flex:1;min-width:0"><b>' + JK.esc(p.name) + '</b><br>' +
      '<span style="color:#FBBF24;font-size:.85rem">' + starStr(p.rating) + '</span> ' +
      '<span class="muted en">' + JK.esc(p.code) + '</span>' +
      (p.notes ? '<br><span class="muted">' + JK.esc(p.notes) + '</span>' : '') + '</div>' +
      '<button class="icon-btn danger" data-del="' + p.id + '">🗑</button></div>').join('');
  JK.wrapLatin(el);
}

document.getElementById('list').addEventListener('click', async e => {
  const id = e.target.dataset && e.target.dataset.del;
  if (id && await JK.confirmDialog('تحذف المنتج ده؟')){ try { S.remove(id); } catch(err){ return; } render(); }
});

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
</html>
