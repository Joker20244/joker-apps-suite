:root{

}
body{background:radial-gradient(700px 320px at 85% 0%, rgba(251,191,36,.12), transparent 60%), var(--bg)}

.cat-bar{display:flex;gap:.4rem;overflow-x:auto;padding:.3rem 0 .6rem}

.src a{color:var(--accent)}
.back{background:none;color:var(--muted);font-size:.9rem;padding:.3rem .6rem}
.sample-note{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);border-radius:12px;padding:.5rem .8rem;font-size:.8rem}

JK.chrome({title:'موسوعة حلول الموبايل', tagline:'مشكلتك ليها حل هنا خطوة بخطوة'});
const CATS = {battery:'البطارية',charging:'الشحن',internet:'الإنترنت',bluetooth:'البلوتوث',apps:'التطبيقات',
  storage:'التخزين',performance:'الأداء',sound:'الصوت',display:'الشاشة',camera:'الكاميرا',system:'النظام',
  calls:'المكالمات',overheating:'السخونية',updates:'التحديثات',security:'الأمان'};
let KB = [], q = '', cat = '';

async function load(){
  KB = Array.isArray(window.KB_SRC) ? window.KB_SRC : [];
  render();
}

document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim(); render(); });

function render(){
  const used = [...new Set(KB.map(x => x.category))];
  document.getElementById('cats').innerHTML =
    '<span class="jk-chip' + (cat === '' ? ' sel' : '') + '" data-cat="">الكل (' + KB.length + ')</span>' +
    used.map(c => '<span class="jk-chip' + (cat === c ? ' sel' : '') + '" data-cat="' + c + '">' + (CATS[c] || c) + ' (' + KB.filter(x => x.category === c).length + ')</span>').join('');
  const items = KB.filter(x =>
    (!cat || x.category === cat) &&
    (!q || (x.title_ar + ' ' + (x.symptoms_ar||[]).join(' ') + ' ' + (CATS[x.category]||'')).includes(q)));
  document.getElementById('list').innerHTML = items.length ? items.map(x =>
    '<div class="jk-card kb-item" data-id="' + x.id + '"><div class="jk-row between">' +
    '<b>' + JK.esc(x.title_ar) + '</b><span style="color:var(--muted)">‹</span></div>' +
    '<span class="jk-chip">' + (CATS[x.category] || x.category) + '</span></div>').join('')
    : JK.emptyState(q ? 'مفيش مشكلة بالوصف ده، جرّب كلمات تانية' : 'الموسوعة فاضية');
}

document.getElementById('cats').addEventListener('click', e => {
  const c = e.target.dataset && e.target.dataset.cat;
  if (c !== undefined){ cat = c; render(); }
});
document.getElementById('list').addEventListener('click', e => {
  const card = e.target.closest('[data-id]');
  if (card) showDetail(KB.find(x => x.id === card.dataset.id));
});
document.getElementById('back').addEventListener('click', () => {
  document.getElementById('detail').style.display = 'none';
  document.getElementById('home').style.display = '';
});

const sec = (t, inner) => inner ? '<h3 style="margin-top:.9rem">' + t + '</h3>' + inner : '';
const ul = arr => (arr && arr.length) ? '<ul style="padding-inline-start:1.2rem">' + arr.map(x => '<li>' + JK.esc(x) + '</li>').join('') + '</ul>' : '';

function showDetail(x){
  if (!x) return;
  document.getElementById('home').style.display = 'none';
  document.getElementById('detail').style.display = '';
  document.getElementById('dBody').innerHTML =
    '<h2>' + JK.esc(x.title_ar) + '</h2><span class="jk-chip">' + (CATS[x.category] || x.category) + '</span>' +
    ((x.warnings_ar && x.warnings_ar.length) ? '<h3 style="margin-top:.6rem">⚠ تحذيرات قبل ما تبدأ</h3>' + x.warnings_ar.map(w => '<div class="warn">' + JK.esc(w) + '</div>').join('') : '') +
    sec('الأعراض', ul(x.symptoms_ar)) +
    sec('الأسباب المحتملة', ul(x.causes_ar)) +
    sec('الحل خطوة بخطوة', (x.steps_ar && x.steps_ar.length) ? '<ol class="steps">' + x.steps_ar.map(s => '<li>' + JK.esc(s) + '</li>').join('') + '</ol>' : '') +
    (x.escalate_ar ? sec('لو المشكلة مستمرة', '<p>' + JK.esc(x.escalate_ar) + '</p>') : '') +
    sec('الوقاية', ul(x.prevention_ar)) +
    (x.when_ar ? sec('بيحصل غالبًا لما', '<p>' + JK.esc(x.when_ar) + '</p>') : '') +
    (x.applies_to_ar ? sec('ينطبق على', '<p>' + JK.esc(x.applies_to_ar) + '</p>') : '') +
    ((x.sources && x.sources.length) ? '<h3 style="margin-top:.9rem">المصادر</h3><div class="src">' + x.sources.map(s => '<a href="' + JK.esc(s) + '" target="_blank" rel="noopener">' + JK.esc(s) + '</a>').join('<br>') + '</div>' : '') +
    '<div class="muted" style="margin-top:.9rem;font-size:.8rem">المعلومات دي إرشادية من مصادر موثقة، مش بديل عن فحص متخصص لو المشكلة هاردوير.</div>';
  JK.wrapLatin(document.getElementById('dBody'));
  window.scrollTo(0, 0);
}

load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
